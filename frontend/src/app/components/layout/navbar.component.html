<aside class="side-nav">
  <div class="nav-head">
    <a class="brand" routerLink="/dashboard" aria-label="Dřevěnka – dashboard">
      <span class="brand-mark" aria-hidden="true">
        <svg class="icon"><use href="#i-brand" /></svg>
      </span>
      <span class="brand-text">
        <span class="brand-title">Dřevěnka s.r.o.</span>
        <span class="brand-subtitle">Skladový systém</span>
      </span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="main-nav"
      [attr.aria-label]="isMenuOpen ? 'Zavřít navigaci' : 'Otevřít navigaci'"
    >
      <svg class="icon" aria-hidden="true">
        <use [attr.href]="isMenuOpen ? '#i-close' : '#i-menu'" />
      </svg>
    </button>
  </div>

  <nav class="nav-links" id="main-nav" [class.open]="isMenuOpen">
    <a routerLink="/dashboard" routerLinkActive="active">
      <svg class="icon" aria-hidden="true"><use href="#i-grid" /></svg>
      <span>Dashboard</span>
    </a>
    <a routerLink="/produkty" routerLinkActive="active">
      <svg class="icon" aria-hidden="true"><use href="#i-tag" /></svg>
      <span>Produkty</span>
    </a>
    <a routerLink="/zasoby" routerLinkActive="active">
      <svg class="icon" aria-hidden="true"><use href="#i-boxes" /></svg>
      <span>Zásoby</span>
    </a>
    <a routerLink="/inventura" routerLinkActive="active">
      <svg class="icon" aria-hidden="true"><use href="#i-clipboard" /></svg>
      <span>Inventura</span>
    </a>
    <a routerLink="/pohyby" routerLinkActive="active">
      <svg class="icon" aria-hidden="true"><use href="#i-arrows" /></svg>
      <span>Pohyby</span>
    </a>
    <a routerLink="/objednavky" routerLinkActive="active">
      <svg class="icon" aria-hidden="true"><use href="#i-receipt" /></svg>
      <span>Objednávky</span>
    </a>
    <a routerLink="/reporty" routerLinkActive="active">
      <svg class="icon" aria-hidden="true"><use href="#i-chart" /></svg>
      <span>Reporty</span>
    </a>
  </nav>

  <a class="nav-stock" routerLink="/reporty" [class.alert]="lowStockCount > 0">
    <span class="nav-stock-label">Pod minimem</span>
    <span class="nav-stock-value" [class.critical]="hasCritical">{{ lowStockCount }}</span>
    <span class="nav-stock-hint">{{ lowStockCount > 0 ? 'řešit v reportech' : 'vše v normě' }}</span>
  </a>
</aside>
