services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drevenka-backend
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=file:../data/sklad.db
      - NODE_ENV=production
    volumes:
      - sqlite_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drevenka-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
    name: drevenka_sqlite_data
