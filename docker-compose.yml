services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drevenka-backend
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=file:../data/sklad.db
      - NODE_ENV=production
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drevenka-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:
    name: drevenka_sqlite_data
